# Binder / conda environment for "Who Holds Government Debt?"
# Matches the dependencies declared in ../pyproject.toml.
# Create with:  conda env create -f environment.yml
# Activate:     conda activate who-holds-government-debt

name: who-holds-government-debt
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11
  - matplotlib>=3.8
  - seaborn>=0.13
  - statsmodels>=0.14
  - openpyxl>=3.1
  - jupyter>=1.0
  - ipykernel>=6.0
  - pip
  - pip:
      - linearmodels>=6.0
