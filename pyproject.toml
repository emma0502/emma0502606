# Dependency manifest for the "Who Holds Government Debt?" REMARK.
# This is a research repository, not an installable package.

[project]
name = "who-holds-government-debt"
version = "0.1.0"
description = "Replication package for the empirical paper 'Who Holds Government Debt?' by Yiran Emma Ma."
requires-python = ">=3.10"
authors = [
    {name = "Yiran Emma Ma"},
]
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = [
    "sovereign debt",
    "debt composition",
    "financial repression",
    "borrowing limits",
    "panel regression",
    "REMARK",
    "Reproduction",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "pyreadstat>=1.2",
    "openpyxl>=3.1",
]

[dependency-groups]
jupyter = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

all = [
    {include-group = "jupyter"},
    {include-group = "dev"},
]

# System dependencies (NOT managed by uv/pip):
#   - LaTeX (pdflatex, bibtex, latexmk): for PDF compilation.
#     Versions: TeX Live 2023+ or MiKTeX 2023+.
#     Packages listed in reproduce/required_latex_packages.txt.

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
exclude = ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv", "build", "dist", "legacy-hafiscal"]
