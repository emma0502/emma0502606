# Smoke test for the empirical pipeline.
#
# Runs ./reproduce.sh --check on every push and pull request, which:
#   * Re-executes the three-stage Python pipeline under
#     Code/empirical_debt_composition/python/
#   * Asserts that headline numbers in Sections 6.3, 6.4, 6.5, 6.6
#     still match the committed Stata logs to within tolerance.
#
# Wall time on a GitHub-hosted ubuntu-latest runner is ~30-60 s.

name: Smoke test (--check)

on:
  push:
    branches:
      - main
      - master
      - "remark-*"
      - "substance-*"
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Minimal install: just what `--check` needs.
          pip install \
            "numpy>=1.26" "pandas>=2.1" "scipy>=1.11" \
            "statsmodels>=0.14" "linearmodels>=6.0"

      - name: Run smoke test
        run: ./reproduce.sh --check
